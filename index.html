<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便利團購 - Fami Order System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 id="txt-app-title" class="text-base font-bold">便利團購 <span class="text-xs font-normal text-emerald-400">Fami Order</span></h1>
                <p id="store-badge" class="text-xs text-gray-400">載入商店中...</p>
            </div>
            <div class="flex items-center space-x-2">
                <span id="user-role-badge" class="text-xs bg-slate-700 text-gray-200 px-2.5 py-1 rounded-full font-medium">驗證中...</span>
                <button onclick="toggleLanguage()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 text-gray-200 px-2 py-1 rounded transition font-mono" id="lang-btn">EN</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow space-y-4">
        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
            <p id="txt-loading" class="text-gray-500 text-sm mt-2">正在連接系統...</p>
        </div>

        <!-- App Container -->
        <div id="app-content" class="hidden space-y-4">
            
            <!-- Khu vực Khách hàng -->
            <section id="customer-section" class="space-y-3">
                <h2 id="txt-product-list-title" class="text-sm font-bold text-slate-700 uppercase tracking-wider">團購商品列表</h2>
                <div id="product-list" class="space-y-2">
                    <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex justify-between items-center">
                        <div>
                            <h4 class="font-semibold text-sm text-slate-800">範例商品 / Sample Item</h4>
                            <p class="text-xs text-emerald-600 font-medium">$100 NTD</p>
                        </div>
                        <button onclick="orderItem()" id="btn-order" class="bg-emerald-600 text-white px-3 py-1.5 rounded-md text-xs font-medium hover:bg-emerald-700 transition">立即訂購</button>
                    </div>
                </div>
            </section>

            <!-- Khu vực Quản lý / Nhân viên -->
            <section id="management-section" class="hidden space-y-3 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <h3 id="txt-mgmt-title" class="font-bold text-slate-800 text-xs uppercase tracking-wider border-b pb-2 text-emerald-700">營運與管理區</h3>
                
                <div id="staff-tools" class="hidden space-y-2">
                    <button onclick="openQRScanner()" id="btn-scan" class="w-full bg-blue-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-blue-700 transition">📷 掃描 QR Code 取貨</button>
                </div>

                <div id="admin-tools" class="hidden space-y-2 pt-1">
                    <button onclick="toggleLockOrders()" id="btn-lock" class="w-full bg-amber-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-amber-700 transition">🔒 鎖定訂購 / 截止</button>
                    <button onclick="manageStaff()" id="btn-staff-mgmt" class="w-full bg-slate-800 text-white py-2 rounded-lg text-xs font-semibold hover:bg-slate-900 transition">👥 門市店員管理</button>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer: Hiển thị LINE ID -->
    <footer class="bg-white border-t border-gray-200 py-2.5 px-4 text-center text-xs text-gray-500">
        <div class="max-w-md mx-auto flex items-center justify-center space-x-2">
            <span class="text-gray-400">LINE ID:</span>
            <span id="user-line-id" class="font-mono bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-[11px]">Loading...</span>
            <button onclick="copyLineId()" id="btn-copy" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded text-[11px] font-semibold transition">📋 Copy</button>
        </div>
    </footer>

    <!-- Script Logic & Translations -->
    <script>
        // Từ điển ngôn ngữ (Traditional Chinese & English)
        const translations = {
            'zh': {
                storePrefix: '商店代號：',
                loading: '正在連接系統...',
                productTitle: '團購商品列表',
                orderBtn: '立即訂購',
                mgmtTitle: '營運與管理區',
                scanBtn: '📷 掃描 QR Code 取貨',
                lockBtn: '🔒 鎖定訂購 / 截止',
                staffMgmtBtn: '👥 門市店員管理',
                copyBtn: '📋 複製',
                roles: {
                    SUPER_ADMIN: '超級管理員',
                    STORE_ADMIN: '店長',
                    STAFF: '店員',
                    CUSTOMER: '顧客',
                    verifying: '驗證中...'
                },
                alerts: {
                    copied: '已複製 LINE ID: ',
                    order: '訂購功能處理中！',
                    scan: '開啟相機掃描取貨 QR Code。',
                    lock: '切換訂購開放狀態。',
                    staff: '管理店員 LINE ID 設定。'
                }
            },
            'en': {
                storePrefix: 'Store ID: ',
                loading: 'Connecting to system...',
                productTitle: 'Group Buying Products',
                orderBtn: 'Order Now',
                mgmtTitle: 'Management & Operations',
                scanBtn: '📷 Scan QR Code',
                lockBtn: '🔒 Lock / Close Orders',
                staffMgmtBtn: '👥 Staff Management',
                copyBtn: '📋 Copy',
                roles: {
                    SUPER_ADMIN: 'Super Admin',
                    STORE_ADMIN: 'Store Admin',
                    STAFF: 'Staff',
                    CUSTOMER: 'Customer',
                    verifying: 'Verifying...'
                },
                alerts: {
                    copied: 'Copied LINE ID: ',
                    order: 'Order processing!',
                    scan: 'Open camera to scan pickup QR code.',
                    lock: 'Toggle order status.',
                    staff: 'Manage staff LINE IDs.'
                }
            }
        };

        let currentLang = 'zh'; // Mặc định là Tiếng Trung Phồn thể

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-btn').innerText = currentLang === 'zh' ? 'EN' : '中';
            updateTexts();
        }

        function updateTexts() {
            const t = translations[currentLang];
            document.getElementById('store-badge').innerText = t.storePrefix + storeId;
            document.getElementById('txt-loading').innerText = t.loading;
            document.getElementById('txt-product-list-title').innerText = t.productTitle;
            document.getElementById('btn-order').innerText = t.orderBtn;
            document.getElementById('txt-mgmt-title').innerText = t.mgmtTitle;
            document.getElementById('btn-scan').innerText = t.scanBtn;
            document.getElementById('btn-lock').innerText = t.lockBtn;
            document.getElementById('btn-staff-mgmt').innerText = t.staffMgmtBtn;
            document.getElementById('btn-copy').innerText = t.copyBtn;

            // Cập nhật lại nhãn vai trò nếu đã tải xong
            if (window.userRole) {
                updateRoleBadge(window.userRole);
            }
        }

        // 1. Đọc tham số 'store' từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store') || 'default_store';
        document.getElementById('store-badge').innerText = translations[currentLang].storePrefix + storeId;

        // 2. Cấu hình Backend URL
        const backendMapping = {
            'store_a': 'YOUR_APPS_SCRIPT_WEB_APP_URL_STORE_A',
            'store_b': 'YOUR_APPS_SCRIPT_WEB_APP_URL_STORE_B',
            'default_store': 'https://script.google.com/macros/s/AKfycb.../exec'
        };
        const currentBackendUrl = backendMapping[storeId] || backendMapping['default_store'];

        // 3. Cấu hình LIFF ID
        const LIFF_ID = 'YOUR_LIFF_ID'; 

        liff.init({ liffId: LIFF_ID })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    liff.getProfile().then(profile => {
                        const userId = profile.userId;
                        document.getElementById('user-line-id').innerText = userId;
                        checkUserRole(userId);
                    });
                }
            })
            .catch(err => {
                console.error('LIFF Error:', err);
                document.getElementById('loading').innerHTML = '<p class="text-red-500 text-sm">LINE LIFF initialization failed.</p>';
            });

        function copyLineId() {
            const userIdText = document.getElementById('user-line-id').innerText;
            if (userIdText && userIdText !== 'Loading...') {
                navigator.clipboard.writeText(userIdText).then(() => {
                    alert(translations[currentLang].alerts.copied + userIdText);
                });
            }
        }

        function checkUserRole(userId) {
            fetch(`${currentBackendUrl}?action=checkPermission&userId=${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('app-content').classList.remove('hidden');

                    window.userRole = data.role || 'CUSTOMER';
                    updateRoleBadge(window.userRole);
                })
                .catch(err => {
                    console.error('Permission check error:', err);
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('app-content').classList.remove('hidden');
                });
        }

        function updateRoleBadge(role) {
            const t = translations[currentLang];
            const roleBadge = document.getElementById('user-role-badge');
            
            if (role === 'SUPER_ADMIN') {
                roleBadge.innerText = t.roles.SUPER_ADMIN;
                roleBadge.className = 'text-xs bg-purple-600 text-white px-2.5 py-1 rounded-full font-medium';
                document.getElementById('management-section').classList.remove('hidden');
                document.getElementById('staff-tools').classList.remove('hidden');
                document.getElementById('admin-tools').classList.remove('hidden');
            } else if (role === 'STORE_ADMIN') {
                roleBadge.innerText = t.roles.STORE_ADMIN;
                roleBadge.className = 'text-xs bg-emerald-600 text-white px-2.5 py-1 rounded-full font-medium';
                document.getElementById('management-section').classList.remove('hidden');
                document.getElementById('staff-tools').classList.remove('hidden');
                document.getElementById('admin-tools').classList.remove('hidden');
            } else if (role === 'STAFF') {
                roleBadge.innerText = t.roles.STAFF;
                roleBadge.className = 'text-xs bg-blue-600 text-white px-2.5 py-1 rounded-full font-medium';
                document.getElementById('management-section').classList.remove('hidden');
                document.getElementById('staff-tools').classList.remove('hidden');
            } else {
                roleBadge.innerText = t.roles.CUSTOMER;
                roleBadge.className = 'text-xs bg-slate-700 text-gray-200 px-2.5 py-1 rounded-full font-medium';
            }
        }

        function orderItem() { alert(translations[currentLang].alerts.order); }
        function openQRScanner() { alert(translations[currentLang].alerts.scan); }
        function toggleLockOrders() { alert(translations[currentLang].alerts.lock); }
        function manageStaff() { alert(translations[currentLang].alerts.staff); }
    </script>
</body>
</html>
