<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ANTI-CACHE META TAGS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>便利團購 - Multi Store System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        .badge-role {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">

    <!-- HEADER NAVIGATION & STORE SELECTOR -->
    <header class="bg-white shadow-sm border-b border-gray-200 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <h1 class="font-bold text-lg text-emerald-600">便利團購</h1>
                <span id="role-badge" class="hidden bg-emerald-100 text-emerald-800 badge-role">CUSTOMER</span>
            </div>

            <div class="flex items-center gap-3">
                <div id="store-selector-container" class="flex items-center">
                    <span id="store-badge" class="text-xs font-medium text-gray-500 bg-gray-100 px-2.5 py-1 rounded-full">
                        🏪 載入門市中...
                    </span>
                </div>

                <select id="lang-select" onchange="toggleLanguage(this.value)" class="text-xs border border-gray-300 rounded px-2 py-1 bg-white text-gray-600 focus:outline-none focus:border-emerald-500">
                    <option value="zh">繁體中文</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <!-- USER LINE ID & COPY BAR -->
        <div class="max-w-4xl mx-auto mt-2 p-2 bg-slate-100 rounded-lg flex items-center justify-between text-xs border border-slate-200">
            <div class="flex items-center gap-2 overflow-hidden">
                <span class="font-bold text-gray-600 whitespace-nowrap">👤 ID:</span>
                <span id="user-line-id" class="font-mono text-gray-800 font-semibold truncate">Connecting LINE...</span>
            </div>
            <button id="btn-copy-id" onclick="copyLineUserId()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-2.5 py-1 rounded transition-colors whitespace-nowrap shadow-sm">
                📋 Copy ID
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4">
        
        <!-- ADMIN CREATION PANEL -->
        <div id="admin-create-store-panel" class="hidden bg-gradient-to-r from-emerald-800 to-teal-900 text-white rounded-xl shadow-md p-5 mb-5 border border-emerald-700">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-base flex items-center gap-2">
                    <span>⚙️</span> Tạo Tiệm Mới & Xuất Liên Kết LIFF (Admin Only)
                </h2>
                <span class="text-xs bg-emerald-700 text-emerald-100 px-2 py-0.5 rounded">Super Admin Mode</span>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                <div>
                    <label class="block text-xs text-emerald-200 mb-1">Mã Tiệm (Store ID)</label>
                    <input type="text" id="new-store-id" placeholder="vd: STORE_BEN_THANH" class="w-full text-xs text-gray-800 p-2 rounded border focus:outline-none focus:ring-2 focus:ring-emerald-400">
                </div>
                <div>
                    <label class="block text-xs text-emerald-200 mb-1">Tên Tiệm (Store Name)</label>
                    <input type="text" id="new-store-name" placeholder="vd: FamilyMart Bến Thành" class="w-full text-xs text-gray-800 p-2 rounded border focus:outline-none focus:ring-2 focus:ring-emerald-400">
                </div>
                <div>
                    <label class="block text-xs text-emerald-200 mb-1">LINE ID Tiệm Trưởng</label>
                    <input type="text" id="new-store-manager" placeholder="LINE User ID" class="w-full text-xs text-gray-800 p-2 rounded border focus:outline-none focus:ring-2 focus:ring-emerald-400">
                </div>
            </div>

            <button onclick="createNewStoreAndGenerateUrl()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold text-xs py-2 px-4 rounded transition-colors shadow">
                ➕ Tạo Cửa Hàng & Sinh Link LIFF Cho Tiệm Trưởng
            </button>

            <div id="generated-url-box" class="hidden mt-4 p-3 bg-emerald-950/80 rounded border border-emerald-600 text-xs">
                <p class="text-emerald-300 font-semibold mb-1">✅ Link LIFF Dành Cho Cửa Hàng Này:</p>
                <div class="flex items-center gap-2">
                    <input type="text" id="generated-url-input" readonly class="w-full bg-emerald-900/60 text-emerald-100 p-2 rounded font-mono text-[11px] border border-emerald-700">
                    <button onclick="copyGeneratedUrl()" class="bg-emerald-500 hover:bg-emerald-400 text-white px-3 py-2 rounded font-medium whitespace-nowrap">
                        📋 Copy Link
                    </button>
                </div>
            </div>
        </div>

        <!-- Banner / Welcome Card -->
        <div class="bg-white rounded-xl shadow-sm p-5 mb-4 border border-gray-100">
            <h2 id="ui-welcome-title" class="text-xl font-bold mb-1 text-gray-800">歡迎使用便利團購系統</h2>
            <p id="ui-welcome-desc" class="text-gray-600 text-sm">請選擇團購商品並送出訂單，門市人員將為您處理。</p>
        </div>

        <!-- Dynamic Content Grid -->
        <div id="app-content" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-full text-center py-12 text-gray-400">
                <p id="ui-loading-text" class="text-sm">正在載入商品列表... / Loading products...</p>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-400">
        &copy; 2026 FamilyMart Group Buying System. All Rights Reserved.
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxWibtxHCD4WPn9wlAnw1cop1E92QDiDByg3JeOCBWoX4mNn2Eul1njGksJlEd_WQN_4g/exec"; 
        const LIFF_ID = "2012142156-phvX28gQ"; 

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === "http:" || url.protocol === "https:";
            } catch (_) {
                return false;
            }
        }

        let currentLang = 'zh';
        let urlParams = new URLSearchParams(window.location.search);
        let storeId = urlParams.get('store') || 'STORE_01';
        let currentUserId = '';
        let currentDisplayName = '';
        let currentUserRole = 'CUSTOMER';
        let availableStores = [];

        function copyLineUserId() {
            if (!currentUserId) return;
            navigator.clipboard.writeText(currentUserId).then(() => {
                alert("📋 Đã sao chép LINE User ID thành công:\n" + currentUserId);
            }).catch(err => {
                const tempInput = document.createElement("input");
                tempInput.value = currentUserId;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                alert("📋 Đã sao chép LINE User ID:\n" + currentUserId);
            });
        }

        async function logAccessToBackend() {
            if (!isValidUrl(API_URL) || !currentUserId) return;
            try {
                fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'logAccess',
                        userId: currentUserId,
                        displayName: currentDisplayName,
                        storeId: storeId,
                        role: currentUserRole
                    })
                });
            } catch (e) {
                console.error("Error logging access:", e);
            }
        }

        async function checkUserRole(userId) {
            if (!isValidUrl(API_URL)) {
                currentUserRole = 'SUPER_ADMIN';
                document.getElementById('admin-create-store-panel').classList.remove('hidden');
                fetchStoresAndRenderSelector({ userStoreId: 'ALL' });
                fetchProducts();
                logAccessToBackend();
                return;
            }

            try {
                const res = await fetch(`${API_URL}?action=checkPermission&userId=${userId}&storeId=${storeId}`);
                const data = await res.json();
                
                if (data.success) {
                    currentUserRole = data.role;
                    const badge = document.getElementById('role-badge');
                    if (badge) {
                        badge.innerText = currentUserRole;
                        badge.classList.remove('hidden');
                    }
                    if (['SUPER_ADMIN', 'SUPERVISOR'].includes(currentUserRole)) {
                        document.getElementById('admin-create-store-panel').classList.remove('hidden');
                    }
                    fetchStoresAndRenderSelector(data);
                    fetchProducts();
                    logAccessToBackend();
                }
            } catch (err) {
                console.error("Error checking permissions:", err);
                fetchProducts();
            }
        }

        async function fetchStoresAndRenderSelector(userPermissions) {
            try {
                if (!isValidUrl(API_URL)) {
                    renderStoreSelector(userPermissions);
                    return;
                }
                const res = await fetch(`${API_URL}?action=getStores`);
                const data = await res.json();
                if (data.success && data.stores) {
                    availableStores = data.stores;
                    renderStoreSelector(userPermissions);
                }
            } catch (err) {
                renderStoreSelector(userPermissions);
            }
        }

        function renderStoreSelector(userPermissions) {
            const container = document.getElementById('store-selector-container');
            if (!container) return;
            const isGlobalAdmin = ['SUPER_ADMIN', 'SUPERVISOR'].includes(currentUserRole);
            const userStoreList = userPermissions ? userPermissions.userStoreId || '' : '';
            const isMultiStoreManager = userStoreList.includes(',') || userStoreList === 'ALL';

            if ((isGlobalAdmin || isMultiStoreManager) && availableStores.length > 0) {
                let allowedStoreIds = userStoreList.split(',').map(s => s.trim());
                let selectHtml = `<select id="header-store-select" onchange="switchStore(this.value)" class="text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg px-2.5 py-1 focus:outline-none">`;
                
                availableStores.forEach(s => {
                    if (isGlobalAdmin || userStoreList === 'ALL' || allowedStoreIds.includes(s.id)) {
                        const selected = s.id === storeId ? 'selected' : '';
                        selectHtml += `<option value="${s.id}" ${selected}>🏪 ${s.name} (${s.id})</option>`;
                    }
                });
                selectHtml += `</select>`;
                container.innerHTML = selectHtml;
            } else {
                const matchedStore = availableStores.find(s => s.id === storeId);
                const storeDisplayName = matchedStore ? matchedStore.name : storeId;
                container.innerHTML = `<span id="store-badge" class="text-xs font-semibold text-emerald-800 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full">🏪 ${storeDisplayName}</span>`;
            }
        }

        async function fetchProducts() {
            const contentDiv = document.getElementById('app-content');
            if (!isValidUrl(API_URL)) {
                contentDiv.innerHTML = `<div class="col-span-full text-center py-8 text-gray-400 text-sm">Demo Mode - No API Connected</div>`;
                return;
            }
            try {
                const res = await fetch(`${API_URL}?action=getProducts&storeId=${storeId}`);
                const data = await res.json();
                if (data.success && data.products && data.products.length > 0) {
                    renderProducts(data.products);
                } else {
                    contentDiv.innerHTML = `<div class="col-span-full text-center py-8 text-gray-400 text-sm">目前無上架商品</div>`;
                }
            } catch (err) {
                console.error("Error fetching products:", err);
            }
        }

        function renderProducts(products) {
            const contentDiv = document.getElementById('app-content');
            contentDiv.innerHTML = products.map(prod => `
                <div class="bg-white rounded-lg border border-gray-100 shadow-sm p-4 flex flex-col justify-between hover:shadow-md transition-shadow">
                    <div>
                        <img src="${prod.imageUrl || 'https://via.placeholder.com/150'}" alt="${prod.name}" class="w-full h-36 object-cover rounded-md mb-3">
                        <h3 class="font-bold text-gray-800">${prod.name}</h3>
                        <p class="text-emerald-600 font-extrabold text-sm mt-1">NT$ ${prod.price}</p>
                    </div>
                    <button class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs py-2 rounded-lg transition-colors">
                        加入團購
                    </button>
                </div>
            `).join('');
        }

        document.addEventListener("DOMContentLoaded", () => {
            liff.init({ liffId: LIFF_ID })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        liff.getProfile().then(profile => {
                            currentUserId = profile.userId;
                            currentDisplayName = profile.displayName;
                            
                            document.getElementById('user-line-id').innerText = currentUserId;
                            document.getElementById('btn-copy-id').classList.remove('hidden');

                            checkUserRole(currentUserId);
                        });
                    }
                })
                .catch(err => {
                    console.warn("LIFF fallback:", err);
                    document.getElementById('user-line-id').innerText = "Guest Mode (Not in LINE)";
                    fetchProducts();
                });
        });
    </script>
</body>
</html>
